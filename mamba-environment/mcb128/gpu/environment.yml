# MCB 128: AI in Molecular Biology - GPU (CUDA) mamba env. Provisional.
name: mcb128-gpu

channels:
- conda-forge

dependencies:
- python=3.12
- jupyterlab
- numpy
- pandas
- scipy
- matplotlib
- seaborn
- scikit-learn
- requests
- tqdm
- pip
- pip:
  # --index-url on its OWN line applies to ALL packages below. The per-line form
  # (`torch --index-url ...`) is NOT honored in a conda environment.yml pip section, so torch had
  # resolved from PyPI as +cu130 (CUDA 13.0) — too new for the A10G node driver (570.x → CUDA 12.8),
  # giving torch.cuda.is_available()=False. cu128 = CUDA 12.8 = matches the driver ceiling.
  - --index-url https://download.pytorch.org/whl/cu128
  - torch
  - torchvision
  - torchaudio
