# MCB 128: AI in Molecular Biology - GPU (CUDA) mamba env. Provisional.
name: mcb128-gpu

channels:
- conda-forge

dependencies:
- python=3.12
- jupyterlab
- numpy
- pandas
- scipy
- matplotlib
- seaborn
- scikit-learn
- requests
- tqdm
- pip
- pip:
  # --index-url on its OWN line applies to ALL packages below. The per-line form
  # (`torch --index-url ...`) is NOT honored in a conda environment.yml pip section, so torch had
  # resolved from PyPI as +cu130, giving torch.cuda.is_available()=False.
  # cu12.8 is compatible with both drivers in use: A10G/R570 (stage) and R580 (prod).
  - --index-url https://download.pytorch.org/whl/cu128
  - torch
  - torchvision
  - torchaudio
