# MCB 128: AI in Molecular Biology - GPU (CUDA) mamba env. Provisional.
name: mcb128-gpu

channels:
- conda-forge

dependencies:
- python=3.12
- jupyterlab
- numpy
- pandas
- scipy
- matplotlib
- seaborn
- scikit-learn
- requests
- tqdm
- pip
- pip:
  - torch --index-url https://download.pytorch.org/whl/cu128
  - torchvision --index-url https://download.pytorch.org/whl/cu128
  - torchaudio --index-url https://download.pytorch.org/whl/cu128
