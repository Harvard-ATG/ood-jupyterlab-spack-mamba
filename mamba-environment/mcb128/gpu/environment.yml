# MCB 128 (AI in Molecular Biology) - GPU mamba environment.
# Provisional / starter list: based on the apphy275 GPU pattern (lean DS stack +
# CUDA torch via cu128 pip wheels) plus scikit-learn for an AI/ML course.
# PENDING: instructor (Elena Rivas) full package list — only "PyTorch" was
# specified in the request. Refine before the course goes live.
name: mcb128-gpu

channels:
- conda-forge

dependencies:
- python>=3.10
- jupyterlab
- numpy
- pandas
- scipy
- matplotlib
- seaborn
- scikit-learn
- requests
- tqdm
- pip
- pip:
  - torch --index-url https://download.pytorch.org/whl/cu128
  - torchvision --index-url https://download.pytorch.org/whl/cu128
  - torchaudio --index-url https://download.pytorch.org/whl/cu128
