# MCB 128: AI in Molecular Biology - GPU (CUDA) mamba env. Provisional.
name: mcb128-gpu

channels:
- conda-forge

dependencies:
- python=3.12
- jupyterlab
- numpy
- pandas
- scipy
- matplotlib
- seaborn
- scikit-learn
- requests
- tqdm
- pip
- pip:
  # --index-url must be on its own line to apply to every package below.
  # cu12.8 is compatible with both drivers in use: A10G/R570 (stage) and R580 (prod).
  - --index-url https://download.pytorch.org/whl/cu128
  - torch
  - torchvision
  - torchaudio
